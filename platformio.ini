; =============================================================================
;  CardputerRadiko - M5Stack Cardputer ADV 用 radiko 受信ファーム
; =============================================================================
;  ビルド:  pio run
;  書込み:  pio run -t upload
;  シリアル: pio device monitor
; =============================================================================

[env:cardputer-adv]
platform  = espressif32
board     = m5stack-stamps3          ; Cardputer / Cardputer ADV は StampS3(ESP32-S3) 系
framework = arduino
monitor_speed = 115200
upload_speed  = 1500000

; --- パーティション（8MB Flash・OTAなし・大きめAPP） ---
board_build.partitions = default_8MB.csv

; --- 依存ライブラリ ---
;  M5Cardputer は M5Unified / M5GFX に依存（自動で入る）。
;  ★Cardputer ADV(ES8311コーデック)対応には新しめの M5Unified が必要。
;   古い版でスピーカーが鳴らない場合は M5Unified を最新へ更新すること。
lib_deps =
    m5stack/M5Cardputer @ ^1.0.3
    ; libhelix(AACデコーダ)。レジストリに無いため git 取得。コミット固定で取得を安定化。
    https://github.com/pschatzmann/arduino-libhelix.git#7d0444c

; --- ビルドフラグ ---
; SBR(HE-AAC高域)を無効化して省メモリ化するビルド前スクリプト
extra_scripts = pre:disable_sbr.py

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM               ; PSRAM 搭載時のみ有効化される（無い場合は無害）
    -DHELIX_LOGGING_ACTIVE=false
    ; ★Serial 出力を本体USB(USB-Serial/JTAG)へ。これが無いとモニタに何も出ない
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; PSRAM が載っていない個体では以下の1行を有効化してビルドしてください
; （StampS3 系は個体により PSRAM 非搭載。psramFound()==false ならこちら）
;   -UBOARD_HAS_PSRAM
